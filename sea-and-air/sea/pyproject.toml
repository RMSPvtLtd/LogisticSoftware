[project]
name = "raaziq-sea-backend"
version = "0.1.0"
description = "Raaziq sea freight vertical backend -- container tracking via pluggable terminal/provider connectors"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ lives outside backend/ (a sibling, not a subpackage of it) -- both
# are added to sys.path here so test files can import backend modules
# flatly (`from integrations.tracking.sapt import ...`) and shared fixtures
# flatly too, without needing `tests/` or its subdirectories to be Python
# packages themselves. Mirrors the air vertical's pytest config exactly.
pythonpath = ["backend", "tests"]
filterwarnings = [
    "error::DeprecationWarning:api.*",
    "error::DeprecationWarning:services.*",
    "error::DeprecationWarning:integrations.*",
    "error::DeprecationWarning:schemas.*",
    "error::DeprecationWarning:utils.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
